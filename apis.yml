apis:
- name: CrateDB Cloud API
  description: >-
    The CrateDB Cloud REST API manages CrateDB Cloud resources — organizations,
    regions, projects, clusters, products, users, roles, subscriptions, and
    audit logs. Authentication uses HTTP Basic auth with an API key id and
    secret generated from the CrateDB Cloud account settings; keys inherit the
    permissions of the user who created them.
  humanURL: https://cratedb.com/docs/cloud/en/latest/reference/api.html
  baseURL: https://console.cratedb.cloud/api/v2
  tags:
  - Cloud
  - Management API
  - Cluster
  tags_raw:
  - Cloud
  - Management API
  - Clusters
  properties:
  - type: Documentation
    url: https://cratedb.com/docs/cloud/en/latest/reference/api.html
  - type: APIReference
    url: https://console.cratedb.cloud/api/docs
- name: CrateDB HTTP SQL Endpoint
  description: >-
    CrateDB's native developer interface: a JSON-over-HTTP SQL endpoint. Clients
    POST a JSON body ({"stmt": "...", "args": [...], "bulk_args": [[...]]}) to
    /_sql (default port 4200) and receive cols/rows/rowcount/col_types.
    PostgreSQL wire protocol is also supported. Errors return a structured
    {"error": {"code": N, "message": "..."}} envelope with codes in the
    4000-5035 range.
  humanURL: https://cratedb.com/docs/crate/reference/en/latest/interfaces/http.html
  baseURL: https://console.cratedb.cloud
