aid: crate-io
name: Crate Io
description: >-
  Crate.io is the company behind CrateDB, a distributed SQL database engineered
  for real-time analytics on large volumes of operational data. CrateDB unifies
  time-series, JSON/document, full-text search, vector, geospatial, and
  relational data behind standard SQL, is PostgreSQL wire-protocol compatible,
  and is built on Lucene for horizontal scalability and sub-second queries over
  billions of rows. Developers interact with CrateDB through an HTTP SQL
  endpoint (POST /_sql on port 4200) and with the managed CrateDB Cloud service
  through the CrateDB Cloud REST API (https://console.cratedb.cloud/api/v2),
  which manages organizations, projects, clusters, users, roles, subscriptions,
  and audit logs. Crate.io is a Speedinvest portfolio company; CrateDB Cloud is
  certified to ISO 27001 and SOC 2 Type II.
